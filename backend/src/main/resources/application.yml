spring:
  application:
    name: civicbridge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civicbridge}
    username: ${DB_USERNAME:civicbridge}
    password: ${DB_PASSWORD:civicbridge}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  storage:
    path: ${FILE_STORAGE_PATH:./data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.civicbridge: INFO
